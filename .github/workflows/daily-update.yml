name: 每日财税政策更新

on:
  schedule:
    # 每天 UTC 01:00 = 北京时间 09:00，自动更新
    - cron: '0 1 * * *'
  workflow_dispatch:
    # 支持手动触发

jobs:
  update-policies:
    name: 抓取并更新政策数据
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安装依赖
        run: |
          npm install axios cheerio

      - name: 运行数据抓取脚本
        run: node update-data.js
        env:
          TZ: 'Asia/Shanghai'

      - name: 提交更新后的数据
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add policies.json
          git diff --quiet && git diff --staged --quiet || \
            git commit -m "chore(data): 每日财税政策更新 $(date +'%Y-%m-%d %H:%M')"
          git push
